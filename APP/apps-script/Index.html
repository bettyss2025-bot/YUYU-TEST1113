<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <?!= roamInclude_('Style'); ?>
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <span class="brand">旅伴 <em>roam</em></span>
      <div class="actions">
        <button id="all-trips" type="button" class="quiet" hidden>所有旅程</button>
        <button id="refresh" type="button" class="quiet" hidden>重新整理</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <p id="status" role="status" aria-live="polite">正在開啟旅伴 roam…</p>
    <section id="trips" hidden>
      <div class="section-head">
        <h1>我的旅程</h1>
        <button type="button" id="new-trip">建立旅程</button>
      </div>
      <div id="trip-list" class="stack"></div>
    </section>
    <section id="trip" hidden>
      <div class="hero">
        <p id="trip-dates"></p>
        <h1 id="trip-name"></h1>
        <button type="button" id="edit-trip" class="quiet" hidden>編輯旅程</button>
      </div>
      <nav aria-label="旅程功能">
        <button type="button" data-view="itinerary" aria-pressed="true">行程</button>
        <button type="button" data-view="expenses" aria-pressed="false">記帳</button>
        <button type="button" data-view="members" aria-pressed="false">旅伴</button>
        <button type="button" data-view="invite" aria-pressed="false" id="invite-tab" hidden>邀請</button>
      </nav>
      <section id="records">
        <div class="section-head">
          <h2 id="record-heading"></h2>
          <button type="button" id="add-record"></button>
        </div>
        <label id="day-filter" class="date-filter">選擇日期 <select id="days"></select></label>
        <div id="summary"></div>
        <div id="record-list" class="stack"></div>
      </section>
      <section id="invitations" hidden>
        <h2>私人邀請連結</h2>
        <p id="invite-status"></p>
        <p>持有有效連結的旅伴可以查看和編輯這趟旅程。</p>
        <div id="invite-output" hidden>
          <label>邀請連結 <input id="invite-url" type="url" readonly></label>
          <button type="button" id="copy-invite">複製連結</button>
        </div>
        <div class="actions">
          <button type="button" id="new-invite">產生邀請連結</button>
          <button type="button" id="revoke-invite" class="danger" hidden>撤銷邀請連結</button>
        </div>
      </section>
    </section>
  </main>
  <dialog id="editor">
    <form id="editor-form">
      <h2 id="editor-title"></h2>
      <div id="fields"></div>
      <p id="editor-error" role="alert"></p>
      <div class="actions editor-actions">
        <button type="button" id="close-editor" class="quiet">取消</button>
        <button type="submit" id="save-editor">儲存</button>
      </div>
    </form>
  </dialog>
  <?!= roamInclude_('Client'); ?>
</body>
</html>

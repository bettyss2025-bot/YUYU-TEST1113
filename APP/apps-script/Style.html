<style>
  :root {
    color-scheme: light;
    --ink: #252e29;
    --muted: #535f58;
    --paper: #fbf8f1;
    --card: #fffdf8;
    --line: #dedbd0;
    --pine: #265747;
    --leaf: #dce9dd;
    --rust: #983f32;
    font-family: "Noto Sans TC", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; padding-bottom: 3rem; }
  h1, h2, p { margin: 0; overflow-wrap: anywhere; }
  h1 { font-family: "Noto Serif TC", Georgia, serif; font-size: clamp(2rem, 7vw, 3.35rem); line-height: 1.2; }
  h2 { font-size: 1.25rem; }
  p { line-height: 1.6; }
  button, input, select, textarea { font: inherit; }
  button {
    min-height: 44px; border: 1px solid transparent; border-radius: .55rem; padding: .55rem .85rem;
    color: white; background: var(--pine); cursor: pointer; font-weight: 650;
  }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 3px solid #aa6b30; outline-offset: 3px; }
  .quiet, .danger { background: transparent; color: var(--pine); border-color: var(--line); }
  .danger { color: var(--rust); }
  .wrap { width: min(100% - 2rem, 52rem); margin-inline: auto; }
  .masthead { border-bottom: 1px solid var(--line); background: var(--card); }
  .masthead-inner, .section-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
  .masthead-inner { min-height: 4.25rem; }
  .brand { font-weight: 750; white-space: nowrap; }
  .brand em { color: var(--pine); font: italic 1.65rem Georgia, serif; padding-left: .2rem; }
  main { padding-top: 1.1rem; }
  #status { margin-bottom: .85rem; color: var(--muted); }
  #status:empty, #editor-error:empty { display: none; }
  #status.error, #editor-error { color: var(--rust); }
  .hero {
    color: #fbfaf1; background: #203f34; border-radius: 1rem; padding: clamp(1.3rem, 5vw, 2.75rem);
    display: grid; gap: .7rem; justify-items: start;
  }
  .hero p { color: #dce9dd; }
  .hero button { color: inherit; border-color: #9fb5a7; }
  nav { display: flex; gap: .35rem; margin: .9rem 0 1.4rem; border-bottom: 1px solid var(--line); }
  nav button { flex: 1; color: var(--muted); background: transparent; margin-bottom: .35rem; }
  nav button[aria-pressed="true"] { background: var(--leaf); color: var(--pine); }
  .section-head { margin-bottom: .8rem; }
  .stack { display: grid; gap: .6rem; }
  .row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .55rem; align-items: center;
    border: 1px solid var(--line); border-radius: .75rem; padding: .8rem; background: var(--card);
  }
  .row .title { font-weight: 700; }
  .row .meta, .empty { color: var(--muted); }
  .row .note { margin-top: .2rem; white-space: pre-wrap; }
  .actions { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  label { display: grid; gap: .3rem; }
  select, input, textarea {
    width: 100%; min-width: 0; min-height: 44px; padding: .45rem .55rem;
    border: 1px solid #a6aea5; border-radius: .45rem; color: var(--ink); background: var(--card);
  }
  textarea { resize: vertical; min-height: 5rem; }
  .date-filter { margin: 0 0 .9rem; max-width: 21rem; }
  #summary:not(:empty) {
    border-radius: .75rem; background: var(--leaf); padding: .85rem 1rem; margin-bottom: .9rem;
  }
  dl { display: grid; gap: .3rem; margin: 0; }
  dl div { display: flex; justify-content: space-between; gap: 1rem; overflow-wrap: anywhere; }
  dl div:first-child { font-size: 1.15rem; font-weight: 750; }
  dd { margin: 0; text-align: right; white-space: nowrap; }
  #invitations { display: grid; gap: .6rem; }
  #invite-output { display: grid; gap: .45rem; justify-items: start; margin: .35rem 0; }
  #invite-output label { width: 100%; }
  dialog {
    border: 1px solid var(--line); border-radius: .85rem; width: min(100% - 2rem, 29rem);
    padding: 1.25rem; max-height: calc(100dvh - 2rem); color: var(--ink); background: var(--paper);
  }
  dialog::backdrop { background: #172f29a6; }
  #fields { display: grid; gap: .75rem; margin: .7rem 0 1rem; }
  .editor-actions { justify-content: flex-end; }
  @media (max-width: 450px) {
    .row .actions { flex-wrap: nowrap; gap: .2rem; }
    .row .actions button { padding-inline: .5rem; }
  }
</style>
